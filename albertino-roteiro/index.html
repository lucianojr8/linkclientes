function rpc(fn,body){
  var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},12000);

function resumo(){
  var t="Roteiro da IA — respostas do Dr. Albertino\n\n";
  S.forEach(function(s,i){
    var e=estado[s.id]||{};
    t+=(i+1)+". "+s.t+": "+(e.v==="ok"?"Está bom":e.v==="edit"?"Mudar: "+(e.txt||"(sem texto)"):"Sem resposta")+"\n";
  });
  t+="\nComentário geral: "+(estado.geral||"(nenhum)")+"\n";
  return t;
}
function salvar(){estado._local=Date.now();estado._resumo=resumo();gravarLocal();pendente=true;mostrar("Salvando...","");clearTimeout(timer);timer=setTimeout(enviar,700)}
function enviar(){
  if(enviando){clearTimeout(timer);timer=setTimeout(enviar,500);return}
  if(!pendente)return;
  pendente=false;enviando=true;
  rpc("salvar_aprovacao",{p_token:TOKEN,p_respostas:estado}).then(function(){
    enviando=false;if(!pendente)mostrar("Salvo ✓","ok");

    enviando=false;pendente=true;
    mostrar("Sem internet agora. Suas respostas ficam guardadas e são enviadas quando a conexão voltar.","erro");
    clearTimeout(timer);timer=setTimeout(enviar,5000);
  });
}
window.addEventListener("online",function(){if(pendente)enviar()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&pendente){clearTimeout(timer);enviar()}});

    var tx=el("span");tx.appendChild(el("b",null,(i+1)+". "+s.t));tx.appendChild(el("small",null,s.d));
    b.appendChild(tx);b.appendChild(el("span","chip",chipTxt(e)));
    b.onclick=function(){location.hash=s.id};
    tela.appendChild(b);
  });
  var f=el("div","final");
  f.appendChild(el("p",null,"Quer mudar algo que vale para todas as conversas? Escreva aqui."));
  var ta=el("textarea");ta.placeholder="Ex: quero que ela seja mais curta, ou que pergunte o plano logo no começo";ta.value=estado.geral||"";
  ta.oninput=function(){estado.geral=ta.value;salvar()};
  f.appendChild(ta);
  var bt=el("button",null,"Concluir");var av=el("div","aviso",estado.concluido?"Revisão concluída. Se mudar algo, salva sozinho.":"");
  bt.onclick=function(){estado.concluido=true;salvar();av.textContent="Obrigado, doutor! O Luciano já recebeu suas respostas."};
  f.appendChild(bt);f.appendChild(av);tela.appendChild(f);
}

function conversa(idx){
  var s=S[idx];tela.innerHTML="";
  var topo=el("div","topo");var v=el("button","voltar","← Todas as conversas");v.onclick=function(){location.hash=""};
  topo.appendChild(v);topo.appendChild(el("span","cont",(idx+1)+" de "+S.length));tela.appendChild(topo);
  tela.appendChild(el("h2",null,s.t));tela.appendChild(el("p","sub",s.d));
  var ch=el("div","chat");
  s.c.forEach(function(m){
    if(m[0]==="n"){ch.appendChild(el("div","n",m[1]));return}
    var b=el("div","b "+m[0]);b.appendChild(el("span","q",m[0]==="a"?"Assistente":"Paciente"));b.appendChild(document.createTextNode(m[1]));ch.appendChild(b);
  });
  tela.appendChild(ch);
  var fb=el("div","fb");fb.appendChild(el("p",null,"Essa conversa está como o senhor quer?"));
  var bs=el("div","btns");var ok=el("button","bok","✓ Está bom");var ed=el("button","bed","✎ Quero mudar");
  bs.appendChild(ok);bs.appendChild(ed);fb.appendChild(bs);
  var ta=el("textarea","hide");ta.placeholder="O que muda? Ex: primeiro perguntar o plano, depois o tipo de consulta";
  fb.appendChild(ta);tela.appendChild(fb);
  var e=estado[s.id]||{};ta.value=e.txt||"";
  function pintar(){var x=estado[s.id]||{};ok.classList.toggle("on",x.v==="ok");ed.classList.toggle("on",x.v==="edit");ta.classList.toggle("hide",x.v!=="edit")}
  ok.onclick=function(){estado[s.id]={v:"ok",txt:ta.value};salvar();pintar()};
  ed.onclick=function(){estado[s.id]={v:"edit",txt:ta.value};salvar();pintar();ta.focus()};
  ta.oninput=function(){(estado[s.id]=estado[s.id]||{v:"edit"}).txt=ta.value;salvar()};
  pintar();
  var nav=el("div","nav");
  if(idx>0){var a=el("button","sec","← Anterior");a.onclick=function(){location.hash=S[idx-1].id};nav.appendChild(a)}
  var p=el("button",null,idx<S.length-1?"Próxima →":"Concluir revisão");
  p.onclick=function(){location.hash=idx<S.length-1?S[idx+1].id:""};nav.appendChild(p);
  tela.appendChild(nav);
}

function rota(){
  var id=location.hash.slice(1),idx=-1;
  S.forEach(function(s,i){if(s.id===id)idx=i});
  if(idx<0)menu();else conversa(idx);
  window.scrollTo(0,0);
}
function carregar(){
  var local=lerLocal();
  return rpc("ler_aprovacao",{p_token:TOKEN}).then(function(srv){
    srv=srv||{};
    if((local._local||0)>(srv._local||0)){estado=local;pendente=true}else{estado=srv}
  }).catch(function(){estado=local;if(local._local)pendente=true});
}
mostrar("Carregando...","");
carregar().then(function(){
  window.addEventListener("hashchange",rota);rota();
  if(pendente)enviar();else mostrar(estado._local?"Salvo ✓":"Suas respostas são salvas sozinhas",estado._local?"ok":"");
});
</script>
</body>
</html>
