<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Proposta Boell Group · Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A2F59;--navy2:#0d3d73;--blue:#14B4F2;--blue-mid:#0B97D5;--ink:#0A2F59;--muted:#5A6B80;--bg:#F4F8FB;--surface:#fff;--line:#E3ECF3;--err:#C0392B}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:linear-gradient(150deg,var(--navy),var(--navy2));color:var(--ink);display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--surface);border-radius:18px;padding:28px 24px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.brand{font-family:Sora,sans-serif;font-weight:800;font-size:15px}
.brand span{color:var(--blue)}
.tag{display:inline-block;margin-top:18px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-mid)}
h1{font-family:Sora,sans-serif;font-size:22px;margin:6px 0 6px;line-height:1.25}
p{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--blue)}
button{width:100%;margin-top:18px;font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:#fff;background:var(--navy);border:0;border-radius:12px;padding:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.err{color:var(--err);font-size:13px;margin-top:12px;min-height:18px}
.foot{font-size:11.5px;color:var(--muted);margin-top:16px;text-align:center}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="brand">Atende Certo <span>IA</span></div>
  <div class="tag">Proposta · Boell Group</div>
  <h1>Acesso restrito</h1>
  <p>Digite o usuário e a senha que você recebeu para abrir a proposta.</p>
  <label for="u">Usuário</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" required>
  <label for="p">Senha</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e" role="alert"></div>
  <div class="foot">Documento confidencial · Atende Certo IA</div>
</form>
